name: windows-minimal-build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOST_ROOT: C:\local\boost_1_87_0
  # 强制 FindMySQL 使用我们下载的 8.4，而不是 runner 预装的 8.0
  # (预装 8.0 缺少 mysql_stmt_bind_named_param，链接会失败)
  MYSQL_ROOT: C:\tools\mysql\current

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 初始化 MSVC 编译环境（不需要完整 Visual Studio IDE）
      - uses: ilammy/msvc-dev-cmd@v1

      # Ninja 构建工具
      - name: Install Ninja
        run: pip install ninja

      # Boost 1.87 预编译二进制（msvc-14.3）。镜像下载用非浏览器 UA，
      # 否则 SourceForge 会返回 HTML 下载页而不是文件。
      - name: Install Boost 1.87
        shell: pwsh
        run: |
          if (Test-Path 'C:\local\boost_1_87_0\boost\version.hpp') { exit 0 }
          $exe = Join-Path $env:RUNNER_TEMP 'boost.exe'
          $url = 'https://downloads.sourceforge.net/project/boost/boost-binaries/1.87.0/boost_1_87_0-msvc-14.3-64.exe'
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $exe -UserAgent 'azerothcore-ci' `
                -ConnectionTimeoutSeconds 60 -OperationTimeoutSeconds 60
              if ((Get-Item $exe).Length -lt 50MB) { throw 'mirror returned an HTML page' }
              break
            } catch {
              Write-Host "attempt $i failed: $($_.Exception.Message)"
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds 15
            }
          }
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Boost installer exit $($p.ExitCode)" }

      # MySQL 8.4 client 头文件 + 库。走 archives CDN，用浏览器 UA。
      - name: Install MySQL client
        shell: pwsh
        run: |
          if (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib') { exit 0 }
          $zip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
          Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' `
            -OutFile $zip -UserAgent 'Mozilla/5.0'
          if ((Get-Item $zip).Length -lt 50MB) { throw 'MySQL zip looks wrong' }
          New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
          Expand-Archive -Path $zip -DestinationPath 'C:\tools\mysql' -Force
          if (Test-Path 'C:\tools\mysql\current') { Remove-Item -Recurse -Force 'C:\tools\mysql\current' }
          Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'

      # 移除 runner 镜像预装的 MySQL 8.0，防止 CMake 找到旧版本库
      - name: Remove preinstalled MySQL 8.0
        shell: pwsh
        run: |
          if (Test-Path 'C:\Program Files\MySQL') {
            Remove-Item -Recurse -Force 'C:\Program Files\MySQL'
            Write-Host "Removed preinstalled MySQL"
          }

      # runner 镜像自带 OpenSSL，直接探测路径
      - name: Detect OpenSSL
        shell: pwsh
        run: |
          $root = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } |
            Select-Object -First 1
          if (-not $root) { throw 'No OpenSSL found on runner image' }
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Ninja 单配置生成器：用 cl 编译，产物直接输出到 build/ 根目录
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DBOOST_ROOT="C:/local/boost_1_87_0" `
            -DMYSQL_LIBRARIES="C:/tools/mysql/current/lib/mysqlclient.lib" `
            -DMYSQL_INCLUDE_DIR="C:/tools/mysql/current/include" `
            -DTOOLS_BUILD=all

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-output
          path: |
            build/bin/*.exe
            build/bin/*.dll
            build/bin/*.pdb
          retention-days: 7
